# Fly.io deployment (spec §11). Rename `app`, then: fly launch --no-deploy → fly deploy.
# One always-on machine (WebSockets + a live event), one persistent volume for SQLite.
app = "soonot"                 # <-- change to your unique app name
primary_region = "nrt"         # Tokyo — nearest Fly region to Korea

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/soonot.db"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true            # phones on cellular need TLS (bingo spec §11)
  auto_stop_machines = false    # keep alive — a stopped machine drops sockets mid-event
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "soonot_data"        # `fly volumes create soonot_data --size 1`
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
