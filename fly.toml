# fly.toml app configuration file generated for soonot on 2026-09-21T13:22:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soonot'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/soonot.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'soonot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
